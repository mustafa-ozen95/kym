# =============================================================================
#  kym — KYM (Kimlik Yönetim Merkezi, OAuth sağlayıcı) — Compose (compose-spec.io)
# =============================================================================
#  Her ortamda aynı dosya: `docker compose up -d --build`, NineDeploy, Coolify,
#  Dokploy, Portainer... Ayarların hepsi ortamdan gelir (.env ya da platformun
#  değişken ekranı); liste ve açıklamalar .env.example'da.
#
#      cp .env.example .env      # en az APP_URL ve DB_PASSWORD
#      docker compose up -d --build
#
#  HTTP portu dışarı AÇILMAZ: alan adını ve TLS'i önündeki vekil (platformun
#  kendisi ya da Caddy/nginx) verir, merkeze konteyner ağından 80'den ulaşır.
#  Vekilsiz deneme için docker-compose.override.example.yml.
#
#  Servisler: panel (nginx + php-fpm + kuyruk işçisi + zamanlayıcı), db
#  (MariaDB), redis (önbellek, oturum, kuyruk; kalıcılık kapalı).
#
#  Dışarıdaki ya da platformun yönettiği bir veritabanı: DB_HOST ve
#  kimlik bilgilerini verin, DB_REPLICAS=0 ile db servisi hiç kalkmaz.
#
#  Adlar: konteyner ve hacimler STACK_PREFIX ile başlar (varsayılan kym). Aynı
#  sunucuda ikinci kurulum STACK_PREFIX'i değiştirir.
# =============================================================================

services:
  panel:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ${STACK_PREFIX:-kym}:local
    container_name: ${STACK_PREFIX:-kym}
    restart: unless-stopped
    # Kuyruk işçisi kapanırken elindeki işi bitirmek için 130 sn bekler
    # (supervisord.conf → isci, stopwaitsecs); süre ondan uzun olmalı.
    stop_grace_period: 3m
    expose: ["80"]
    # Tanımsız değişken konteynere GEÇMEZ (boş değer de değil): varsayılanlar
    # başlatıcıda ve config/ altında.
    environment:
      - APP_NAME
      - APP_ENV
      - APP_DEBUG
      - APP_KEY
      - APP_PREVIOUS_KEYS
      - APP_URL
      - APP_LOCALE
      - APP_TIMEZONE
      - TRUSTED_PROXIES
      - DB_HOST
      - DB_PORT
      - DB_DATABASE
      - DB_USERNAME
      - DB_PASSWORD
      - REDIS_HOST
      - REDIS_PORT
      - REDIS_PASSWORD
      - IDENTITY_TOKEN_MINUTES
      - IDENTITY_REFRESH_DAYS
      - IDENTITY_ISSUER
      - AUDIT_KEY
      - THEME_COOKIE_DOMAIN
      - UPDATE_TOKEN
      - UPDATE_HOOK_URL
      - SAMPLE_DATA
      - ADMIN_NAME
      - ADMIN_EMAIL
      - ADMIN_PASSWORD
      - MAIL_MAILER
      - MAIL_HOST
      - MAIL_PORT
      - MAIL_USERNAME
      - MAIL_PASSWORD
      - MAIL_SCHEME
      - MAIL_FROM_ADDRESS
      - MAIL_FROM_NAME
    volumes:
      # ⚠ APP_KEY ile BİRLİKTE yedeklenir: OAuth imza anahtarları (oauth/),
      # uzak veritabanı bağlantısı ve iki adım gizli anahtarları ona bağlı.
      # Kaybolursa dağıtılmış bütün jetonlar geçersiz olur: bağlı panellerdeki
      # kullanıcılar toptan düşer.
      - storage:/uygulama/storage/app
      - logs:/uygulama/storage/logs
    depends_on:
      db:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

  db:
    image: mariadb:11.4
    container_name: ${STACK_PREFIX:-kym}-db
    restart: unless-stopped
    # 0: dışarıdaki ya da platformun veritabanı kullanılıyor (DB_HOST).
    deploy:
      replicas: ${DB_REPLICAS:-1}
    # Docker'ın varsayılan 10 saniyesi InnoDB boşaltmasına yetmeyebilir ve
    # veritabanı kirli kapanır.
    stop_grace_period: 5m
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-kimlik}
      MARIADB_USER: ${DB_USERNAME:-kimlik}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD gerekli (.env.example)}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6

  redis:
    image: redis:7.4-alpine
    container_name: ${STACK_PREFIX:-kym}-redis
    restart: unless-stopped
    # Kalıcılık KAPALI: burada yalnız önbellek, oturum ve kuyruk durur.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6

networks:
  default:
    # Ağ yalıtımı: true iken konteynerler bağlı panellere, posta sunucusuna ve
    # dışarıya bağlanamaz (taşıma ya da deneme kurulumunda canlıya dokunmamak
    # için). Port yayınları da o zaman dışarıdan erişilmez.
    internal: ${NETWORK_ISOLATED:-false}

volumes:
  storage:
    name: ${STACK_PREFIX:-kym}_storage
  logs:
    name: ${STACK_PREFIX:-kym}_logs
  database:
    name: ${STACK_PREFIX:-kym}_database
