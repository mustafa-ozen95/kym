# Yalnız 80 (düz HTTP). TLS'i önündeki vekil bitirir: platformun kendisi
# (NineDeploy/Traefik, Coolify...) ya da Caddy/nginx. Merkez isteğin HTTPS
# olduğunu vekilin X-Forwarded-Proto başlığından bilir (bootstrap/app.php →
# trustProxies).
server {
    listen 80 default_server;

    server_name _;

    root /uygulama/public;
    index index.php;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/kimlik.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        # Portu geri kazandırır; gerekçe nginx.conf'taki map'te.
        #
        # Merkez için bu ayrıntı KRİTİK: OAuth dönüş adresi kayıtlı adresle
        # BİREBİR eşleşmek zorunda. Port düşerse takas "redirect_uri mismatch"
        # ile reddedilir ve giriş hiç tamamlanmaz.
        fastcgi_param HTTP_HOST $host$istek_portu;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
    }

    # index.php dışında hiçbir PHP dosyası doğrudan çalıştırılmaz.
    location ~ \.php$ {
        return 404;
    }

    location ~* \.(css|js|mjs|map|jpg|jpeg|png|gif|ico|svg|webp|woff2?|ttf|otf|eot)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
